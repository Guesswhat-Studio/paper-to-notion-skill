schema_version: "1.0.0"
database:
  title: "Paper Reading Library"
  description: "Lean index for paper reading reports. Long analysis, figures, formulas, tables, and review notes belong in each page body."
  title_property: "Name"
  default_language: "English"

properties:
  - name: "Name"
    type: "TITLE"
    required: true
    purpose: "Display title. English by default."

  - name: "Original Title"
    type: "RICH_TEXT"
    required: true
    purpose: "Official paper title."

  - name: "Authors"
    type: "RICH_TEXT"
    required: true
    purpose: "Author list as written in the paper."

  - name: "Publication Date"
    type: "DATE"
    required: false
    purpose: "Publication, arXiv, conference, or journal date when known."

  - name: "Year"
    type: "NUMBER"
    required: true
    purpose: "Numeric year for filtering and charts."

  - name: "Created Date"
    type: "CREATED_TIME"
    required: false
    readonly: true
    purpose: "Notion-created timestamp."

  - name: "Venue"
    type: "MULTI_SELECT"
    required: false
    purpose: "Venue labels."
    options:
      - { name: "arXiv", color: "gray" }
      - { name: "NeurIPS", color: "blue" }
      - { name: "ICML", color: "blue" }
      - { name: "ICLR", color: "purple" }
      - { name: "ACL", color: "green" }
      - { name: "EMNLP", color: "green" }
      - { name: "CVPR", color: "red" }
      - { name: "ICCV", color: "red" }
      - { name: "ECCV", color: "red" }
      - { name: "SIGGRAPH", color: "orange" }
      - { name: "KDD", color: "yellow" }
      - { name: "WWW", color: "yellow" }
      - { name: "AAAI", color: "purple" }
      - { name: "IJCAI", color: "purple" }
      - { name: "Journal", color: "brown" }
      - { name: "Workshop", color: "gray" }
      - { name: "Preprint", color: "gray" }

  - name: "Field"
    type: "MULTI_SELECT"
    required: false
    purpose: "Broad research area labels."
    options:
      - { name: "Machine Learning", color: "blue" }
      - { name: "Natural Language Processing", color: "green" }
      - { name: "Computer Vision", color: "red" }
      - { name: "Robotics", color: "orange" }
      - { name: "Systems", color: "gray" }
      - { name: "Theory", color: "purple" }
      - { name: "HCI", color: "pink" }
      - { name: "Data", color: "yellow" }
      - { name: "Security", color: "brown" }

  - name: "Type"
    type: "MULTI_SELECT"
    required: false
    purpose: "Paper or contribution type labels."
    options:
      - { name: "method", color: "blue" }
      - { name: "survey", color: "purple" }
      - { name: "benchmark", color: "yellow" }
      - { name: "dataset", color: "green" }
      - { name: "theory", color: "purple" }
      - { name: "system", color: "gray" }
      - { name: "empirical", color: "orange" }
      - { name: "application", color: "pink" }

  - name: "Keywords"
    type: "RICH_TEXT"
    required: false
    purpose: "Paper-specific keywords or topic phrases, comma-separated."

  - name: "Reading Status"
    type: "STATUS"
    fallback_type: "SELECT"
    required: false
    default: "Read"
    purpose: "Workflow state."
    options:
      - { name: "To Read", color: "gray" }
      - { name: "Reading", color: "yellow" }
      - { name: "Read", color: "green" }
      - { name: "Reviewed", color: "blue" }

  - name: "Read Date"
    type: "DATE"
    required: false
    purpose: "Date the report was written or last substantially updated."

  - name: "Rating"
    type: "SELECT"
    required: false
    purpose: "Reader rating."
    options:
      - { name: "1 star", color: "red" }
      - { name: "2 stars", color: "orange" }
      - { name: "3 stars", color: "yellow" }
      - { name: "4 stars", color: "green" }
      - { name: "5 stars", color: "blue" }

  - name: "DOI"
    type: "URL"
    required: false
    purpose: "DOI URL, preferably https://doi.org/..."

  - name: "arXiv"
    type: "URL"
    required: false
    purpose: "arXiv abstract URL."

  - name: "Code"
    type: "URL"
    required: false
    purpose: "Official code or best verified implementation URL."

  - name: "Report Language"
    type: "SELECT"
    required: true
    default: "English"
    purpose: "Report body language."
    options:
      - { name: "English", color: "blue" }
      - { name: "Chinese", color: "green" }
      - { name: "Bilingual", color: "purple" }

views:
  - name: "All Papers"
    type: "table"
    configure: 'SORT BY "Read Date" DESC'
  - name: "By Venue"
    type: "board"
    configure: 'GROUP BY "Venue"'
  - name: "To Review"
    type: "table"
    configure: 'FILTER "Reading Status" != "Reviewed"; SORT BY "Read Date" DESC'
  - name: "Top Rated"
    type: "table"
    configure: 'SORT BY "Rating" DESC'

deduplication:
  order:
    - "DOI"
    - "arXiv"
    - "Original Title"

optional_extensions:
  research_flow:
    description: "Add only when the user asks for daily discovery, conference tracking, scoring, or team workflows."
    properties:
      - { name: "Score", type: "NUMBER", purpose: "Composite score for discovery triage." }
      - { name: "Relevance Score", type: "NUMBER", purpose: "Interest/category match score." }
      - { name: "Recency Score", type: "NUMBER", purpose: "Freshness score." }
      - { name: "Popularity Score", type: "NUMBER", purpose: "Citation/venue signal." }
      - { name: "Social Score", type: "NUMBER", purpose: "GitHub stars, social mentions, or community signal." }
      - { name: "Quality Score", type: "NUMBER", purpose: "Abstract/method/author/venue quality estimate." }
      - { name: "Assignee", type: "PEOPLE", fallback_type: "RICH_TEXT", purpose: "Team reader assignment." }
      - name: "Priority"
        type: "SELECT"
        purpose: "Triage priority."
        options:
          - { name: "Low", color: "gray" }
          - { name: "Medium", color: "yellow" }
          - { name: "High", color: "red" }
      - name: "Discovery Source"
        type: "SELECT"
        purpose: "Source used for discovery."
        options:
          - { name: "arXiv", color: "gray" }
          - { name: "Semantic Scholar", color: "blue" }
          - { name: "DBLP", color: "green" }
          - { name: "OpenReview", color: "purple" }
          - { name: "Manual", color: "yellow" }
      - { name: "Conference Year", type: "NUMBER", purpose: "Conference tracking." }
